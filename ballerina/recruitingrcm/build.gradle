import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'net.researchgate.release'
    id 'io.ballerina.plugin'
}

description = 'Ballerina - SAP SuccessFactors Recruiting Job Application Interview API'

def packageName = "sap.successfactors.recruitingrcm"
def moduleVersion = stripBallerinaExtensionVersion("${project.recruitingrcmVersion}")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

def ballerinaTomlFile = file("${project.projectDir}/Ballerina.toml")

ballerina {
    packageOrganization = project.ext.packageOrg
    module = packageName
    isConnector = true
    platform = "any"
    testCoverageParam = '--code-coverage --coverage-format=xml --includes=ballerinax.* --excludes=modules/**/**'
}

task updateTomlFiles {
    doLast {
        // Bump the version in place; the rest of Ballerina.toml (keywords, Name/ tag,
        // description, etc.) is hand-maintained per connector and must not be clobbered
        // by the shared build-config/resources/Ballerina.toml template.
        def tomlText = ballerinaTomlFile.text
        tomlText = tomlText.replaceFirst(/(?m)^version\s*=\s*".*"$/, "version = \"${moduleVersion}\"")
        ballerinaTomlFile.text = tomlText
    }
}

task commitTomlFiles {
    doLast {
        project.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml"
            }
        }
    }
}

release {
    buildTasks = ['build']
    failOnSnapshotDependencies = true
    versionPropertyFile = '../../gradle.properties'
    versionProperties = ['recruitingrcmVersion']
    tagTemplate = 'recruitingrcm-v${version}'
    git {
        requireBranch = "release-recruitingrcm-${moduleVersion}"
        pushToRemote = 'origin'
    }
}

publishToMavenLocal.dependsOn build
publish.dependsOn build
