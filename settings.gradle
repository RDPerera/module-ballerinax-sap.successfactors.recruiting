pluginManagement {
    plugins {
        id "net.researchgate.release" version "${releasePluginVersion}"
        id "de.undercouch.download" version "${downloadPluginVersion}"
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
    }

    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

plugins {
    id "com.gradle.enterprise" version "3.2"
}

rootProject.name = "module-ballerinax-sap.successfactors.recruiting"

include ':recruiting-sanitation'
include ':recruiting-ballerina'
include ':recruiting-ballerina:rcmjobrequisition'
include ':recruiting-ballerina:rcmjobapplication'
include ':recruiting-ballerina:rcmcandidate'
include ':recruiting-ballerina:rcmoffer'
include ':recruiting-ballerina:recruitingrcm'
include ':recruiting-examples'

project(':recruiting-sanitation').projectDir = file("docs/sanitation")
project(':recruiting-ballerina').projectDir = file("ballerina")
project(':recruiting-ballerina:rcmjobrequisition').projectDir = file("ballerina/rcmjobrequisition")
project(':recruiting-ballerina:rcmjobapplication').projectDir = file("ballerina/rcmjobapplication")
project(':recruiting-ballerina:rcmcandidate').projectDir = file("ballerina/rcmcandidate")
project(':recruiting-ballerina:rcmoffer').projectDir = file("ballerina/rcmoffer")
project(':recruiting-ballerina:recruitingrcm').projectDir = file("ballerina/recruitingrcm")
project(':recruiting-examples').projectDir = file("examples")

gradleEnterprise {
    buildScan {
        termsOfServiceUrl = 'https://gradle.com/terms-of-service'
        termsOfServiceAgree = 'yes'
    }
}
